<style>
  :root{
    --bg: #0B0F14;
    --surface: #121821;
    --surface-2: #182029;
    --ink: #E7ECEF;
    --ink-dim: #8B98A3;
    --line: #232C36;
    --brass: #6F93A8;
    --brass-dim: #3E5561;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img{ max-width:100%; display:block; }
  a{ color: inherit; text-decoration: none; }

  h1, h2, h3, .display{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* Nav — this page drops the full bar the other pages use. The player is the
     whole point here, so the nav collapses to a single floating menu button at
     every width (not just mobile), letting the player sit near the top of the
     viewport. The panel it opens is the same one the other pages show on
     mobile, so the interaction stays familiar. */
  header{
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: none;
    border: 0;
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding: 18px 32px;
  }
  /* no brand lockup in the bar — "Home" lives inside the menu panel instead */
  .nav-links{
    position: fixed; top: 64px; right: 30px;
    width: max-content; max-width: calc(100vw - 76px);
    z-index: 1001;
    background: var(--surface);
    display:flex; flex-direction: column; align-items: flex-start; gap: 18px;
    list-style:none;
    padding: 20px 28px;
    transform: translateX(calc(100% + 48px));
    transition: transform 0.3s ease;
    border: 1px solid var(--brass-dim);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  }
  .nav-links.open{ transform: translateX(0); }
  .nav-links a{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--brass);
    padding-bottom: 3px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .nav-links a:hover, .nav-links a:focus-visible{
    color: var(--ink);
    border-bottom-color: var(--brass);
  }
  .nav-links a[aria-current="page"]{
    color: var(--ink);
    border-bottom-color: var(--brass-dim);
  }
  .nav-toggle{
    display:flex;
    flex-direction:column;
    gap:5px;
    width: 28px;
    background:none; border:0;
    cursor:pointer;
    z-index: 1002;
  }
  /* the button floats over the photo, so the bars carry their own shadow */
  .nav-toggle span{
    height:2px; background: var(--ink); width:100%; display:block;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  /* Hero */
  .hero{
    min-height: 68vh;
    padding-top: 40px;
    padding-bottom: 0;
    display:flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  .hero-bg-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index: 0;
  }
  .hero-bg-video canvas{
    display:block;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(11,15,20,0.4) 0%, rgba(11,15,20,0.15) 38%, rgba(11,15,20,0.92) 100%),
      radial-gradient(ellipse 42% 34% at 50% 50%, rgba(11,15,20,0.6), transparent 72%),
      radial-gradient(ellipse 65% 60% at 50% 50%, rgba(11,15,20,0.05), rgba(11,15,20,0.5) 75%),
      radial-gradient(ellipse 60% 55% at 50% 50%, rgba(111,147,168,0.1), transparent);
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    z-index: 1;
    background-image:
      repeating-linear-gradient(180deg, transparent 0 2px, rgba(255,255,255,0.012) 2px 4px);
    pointer-events:none;
  }
  .hero .wrap{ position: relative; z-index: 2; }
  .hero-inner{
    max-width: 780px;
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.9s ease-out 0.15s forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-inner{ animation: none; opacity:1; transform:none; }
  }
  .kicker{
    font-size: 14px;
    color: var(--brass);
    margin-bottom: 22px;
  }
  .hero h1{
    font-size: clamp(44px, 7vw, 84px);
    line-height: 1.02;
    margin-bottom: 12px;
  }
  .roles{
    font-size: clamp(17px, 2.6vw, 30px);
    color: var(--ink);
    margin-bottom: 16px;
    font-family:'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .tagline{
    font-size: clamp(15px, 1.7vw, 18px);
    color: var(--ink);
    font-weight: 600;
    max-width: 540px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }
  .cta-row{ display:flex; gap:16px; align-items:center; justify-content: center; flex-wrap: wrap; }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 14px 26px;
    border-radius: 2px;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary{
    background: var(--brass);
    color: #16130C;
  }
  .btn-primary:hover{ background:#CB9C42; }
  .btn-ghost{
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn-ghost:hover{ border-color: var(--brass-dim); }

  /* Section shared */
  section{ padding: 120px 0; }
  #reel{ padding-top: 0; padding-bottom: 72px; scroll-margin-top: 72px; }
  .section-head{
    display:flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    margin-top: 18px;
  }
  .section-head h2{ font-size: clamp(28px, 3.4vw, 40px); }
  .section-head p{ color: var(--ink); max-width: 480px; margin: 0 auto; font-size: 15px; }

  /* ---------- Player + filmstrip nav (reel) ---------- */
  /* Ported directly from the player-filmstrip-component template (itself
     pulled from grpny.com/work.html). --paper/--ink/--red are remapped,
     locally to .player-block, onto this site's own tokens so everything
     below can stay an exact copy of the template rather than a rebuild. */
  .player-block{
    /* NOTE: do NOT redefine --ink here. `--paper: var(--ink)` would then
       resolve against the redefined (dark) value on this same element and
       every --paper text color would render dark-on-dark. The one template
       rule that used --ink (.index background) points at --surface instead. */
    --paper: var(--ink);
    --red: var(--brass);
    /* Side padding reserves room for the carousel arrows, which are
       positioned 52px outside the filmstrip. Without it they sat in the
       page gutter and ran to the window edge on narrower screens. */
    max-width: 900px;
    padding: 0 60px;
    /* no top margin on this page: #reel's padding-top alone sets the player's
       position so it lines up with the menu button. (On index.html this is
       28px, to separate the player from the copy above it.) */
    margin: 0 auto;
    font-family: 'Work Sans', sans-serif;
    color: var(--paper);
  }

  /* ---------- Player ---------- */
  .video-overlay{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 9;
    background:#000;
    overflow:hidden;
  }
  .video-overlay img, .video-overlay iframe{
    position:absolute; inset:0; border:0;
    width:100%; height:100%;
    opacity:0; transition: opacity 0.4s ease;
  }
  .video-overlay img{ object-fit:cover; object-position: center 25%; }
  .video-overlay img.active, .video-overlay iframe.active{ opacity:1; }
  @keyframes revealFade{ from{ opacity:0; } to{ opacity:1; } }
  .video-overlay img.first-reveal{ transition:none; animation: revealFade 2.2s ease-out forwards; }

  .play-ring{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width: 72px; aspect-ratio:1; border-radius:50%;
    border: 2px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:3;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .play-ring:hover{ background: var(--red); border-color: var(--red); }
  .play-ring svg{ width:35%; height:35%; fill: var(--paper); margin-left:6%; }

  /* ---------- Filmstrip thumbnail nav ---------- */
  .strip-zone{
    margin-top: 24px;
    width: 100%;
    display:flex; flex-direction:column; align-items:center;
  }
  .carousel-wrap{
    position:relative; width: 100%;
    aspect-ratio: 1920 / 350;
  }
  .index{
    display:flex; flex-wrap:nowrap; gap: 0;
    width: 100%; height: 100%;
    background-color: var(--surface);
    overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; scroll-snap-type:x mandatory;

  .index::-webkit-scrollbar{ display:none; }
  .index button{
    position:relative; flex: 0 0 20%; height:100%;
    scroll-snap-align:start;
    background:none;
    border:2px solid transparent; box-sizing:border-box; cursor:pointer; padding:0;
    overflow:visible;
    opacity:0.7; transition: opacity 0.2s ease;
  }
  .index button .thumb-img-wrap{
    position:absolute; top:13.7%; bottom:15.4%; left:2%; right:2%;
    overflow:hidden; z-index:1;
    background-color:#111; background-size:cover; background-position:center;
  }
  .index button img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(0.3); }
  .index button:hover, .index button.active{ opacity:1; }
  .index button.active{ border-color: var(--red); }

  .thumb-title{
    position:absolute; bottom:15.4%; left:2%; right:2%;
    background: rgba(5,5,3,0.92); color:#fff; font-size:11px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; text-align:center;
    padding:5px 6px; border:1px solid rgba(243,239,230,0.25);
    opacity:0; pointer-events:none; transition: opacity 0.15s ease; z-index:10;
  }
  .index button:hover .thumb-title{ opacity:1; }

  .carousel-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:0; height:0; background:none; border-style:solid; padding:0; z-index:6;
    cursor:pointer; transition: opacity 0.2s ease;
  }
  .carousel-arrow:hover{ opacity:0.75; }
  .carousel-prev{ left:-52px; border-width:24px 34px 24px 0; border-color:transparent var(--red) transparent transparent; }
  .carousel-next{ right:-52px; border-width:24px 0 24px 34px; border-color:transparent transparent transparent var(--red); }

  /* ---------- Title / description ---------- */
  .now-showing{
    position: relative;
    z-index: 20;
    margin-top: 24px;
    width: 100%; text-align: center;
  }
  .ns-title{
    font-family:'Archivo Black', sans-serif; font-weight:400; text-transform:uppercase;
    font-size: clamp(18px, 2.6vw, 30px); line-height:1.15; margin-bottom:8px;
  }
  .ns-desc{
    font-size: clamp(14px, 1.6vw, 18px); color: var(--paper); line-height:1.5;
  }

  @media (max-width: 700px){
    .player-block{ padding: 0 36px; }
    .index button{ flex: 0 0 calc((100% - 16px)/3); }
    .carousel-prev{ left:-30px; border-width:16px 22px 16px 0; }
    .carousel-next{ right:-30px; border-width:16px 0 16px 22px; }
  }


  /* ---------- Showreel page backdrop ----------
     The studio still sits behind the whole page, fixed so it doesn't scroll
     with the content. Three stacked layers sit over it: a vignette (radial),
     a top-to-bottom darkening gradient, and a flat wash. Together they pull
     the photo well below the player's brightness so the filmstrip and text
     stay legible and the image reads as atmosphere rather than content. */
  body.showreel{
    background: var(--bg);
  }
  .reel-backdrop{
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url("assets/showreel-bg.jpg");
    background-size: cover;
    background-position: center 40%;
    background-repeat: no-repeat;
    pointer-events: none;
  }
  .reel-backdrop::after{
    content:"";
    position:absolute; inset:0;
    background:
      /* vignette — darkens the corners, keeps the centre relatively open */
      radial-gradient(ellipse 75% 70% at 50% 45%, rgba(11,15,20,0.30) 0%, rgba(11,15,20,0.72) 62%, rgba(11,15,20,0.94) 100%),
      /* vertical falloff — header and footer ends go darkest */
      linear-gradient(180deg, rgba(11,15,20,0.92) 0%, rgba(11,15,20,0.62) 30%, rgba(11,15,20,0.78) 70%, rgba(11,15,20,0.97) 100%),
      /* flat wash — mutes the remaining midtones so the photo sits back */
      rgba(11,15,20,0.42);
  }
  /* everything above the backdrop. NOTE: header is deliberately excluded —
     it is position:absolute so it takes no space in the flow, which is what
     lets the player sit flush with the menu button. Listing it here would
     override that (this rule comes later in the sheet) and push main down. */
  main, footer{ position: relative; z-index: 1; }

  /* Player top aligns exactly with the bottom edge of the menu button.
     Button height = 3 bars x 2px + 2 gaps x 5px = 16px, sitting under
     nav.wrap's 18px top padding, so its bottom edge lands at 34px.
     The 18px nav padding is the same at every breakpoint, so this holds. */
  #reel{ padding-top: 34px; padding-bottom: 96px; }

  @media (max-width: 860px){
    /* fixed backgrounds are unreliable on mobile browsers; scroll it instead */
    .reel-backdrop{ position: absolute; height: 100%; }
  }

  footer{
    border-top: 1px solid var(--line);
    padding: 56px 0;
  }
  .footer-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 20px;
  }
  footer .brand{ font-size:16px; }
  .footer-links{ display:flex; gap:28px; list-style:none; }
  .footer-links a{ font-size:14px; color: var(--ink-dim); }
  .footer-links a:hover{ color: var(--ink); }
  .footer-note{ font-size: 13px; color: var(--ink-dim); margin-top: 24px; }

  @media (max-width: 860px){
    /* the menu panel and button are defined at base width on this page, so
       only the spacing changes here */
    section{ padding: 80px 0; }
    #reel{ padding-top: 34px; padding-bottom: 64px; }
  }
  @media (max-width: 560px){
    .wrap{ padding: 0 20px; }
    nav.wrap{ padding: 18px 20px; }
    .nav-links{ right: 20px; max-width: calc(100vw - 56px); }
    .brand{ font-size: 15px; }
    .roles{ white-space: normal; font-size: clamp(15px, 4.5vw, 20px); }
  }
</style>
</head>

  var current = 0;
  var screen = document.getElementById('screen');
  var playRing = document.getElementById('play-ring');
  var nsTitle = document.getElementById('ns-title');
  var nsDesc = document.getElementById('ns-desc');
  var indexEl = document.getElementById('index');
  var imgCache = {};
  var hasRevealed = false;
  var ytPlayer = null;

  function getImg(p){
    if (imgCache[p.id]) return imgCache[p.id];
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = p.poster ? p.poster : 'https://img.youtube.com/vi/' + p.id + '/hqdefault.jpg';
    img.alt = p.title + ' thumbnail';
    img.addEventListener('error', function(){
      if (!img.dataset.fallbackApplied) {
        img.dataset.fallbackApplied = '1';
        img.src = 'https://img.youtube.com/vi/' + p.id + '/default.jpg';
      }
    });
    if (!hasRevealed){
      img.classList.add('first-reveal');
      hasRevealed = true;
      img.addEventListener('animationend', function(){ img.classList.remove('first-reveal'); }, { once: true });
    }
    screen.insertBefore(img, screen.firstChild);
    imgCache[p.id] = img;
    return img;
  }

  function stopPlayback(){
    if (ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} ytPlayer = null; }
    pendingPlay = null;
    var existing = screen.querySelector('#yt-mount, iframe');
    if (existing) existing.remove();
  }

  function render(){
    var p = PROJECTS[current];
    Object.keys(imgCache).forEach(function(id){ imgCache[id].classList.remove('active'); });
    getImg(p).classList.add('active');
    nsTitle.textContent = p.title;
    nsDesc.textContent = p.desc;
    stopPlayback();
    playRing.style.display = 'flex';
    Array.prototype.forEach.call(indexEl.children, function(btn, i){
      btn.classList.toggle('active', i === current);
    });
  }

  function scrollStripToActive(){
    var btn = indexEl.children[current];
    if (!btn) return;
    var target = btn.offsetLeft - (indexEl.clientWidth - btn.offsetWidth) / 2;
    indexEl.scrollTo({ left: target, behavior: 'smooth' });
  }

  function buildIndex(){
    PROJECTS.forEach(function(p, i){
      var btn = document.createElement('button');
      var wrap = document.createElement('span');
      wrap.className = 'thumb-img-wrap';
      wrap.style.backgroundImage = "url('https://img.youtube.com/vi/" + p.id + "/hqdefault.jpg')";
      var titleSpan = document.createElement('span');
      titleSpan.className = 'thumb-title';
      titleSpan.textContent = p.title;
      btn.appendChild(wrap);
      btn.appendChild(titleSpan);
      btn.setAttribute('aria-label', 'Play ' + p.title);
      btn.addEventListener('click', function(){ current = i; render(); scrollStripToActive(); play(); });
      indexEl.appendChild(btn);
    });
  }

  var ytApiReady = false;
  var pendingPlay = null;
  window.onYouTubeIframeAPIReady = function(){
    ytApiReady = true;
    if (pendingPlay){ var fn = pendingPlay; pendingPlay = null; fn(); }
  };
  (function(){
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  function play(){
    var p = PROJECTS[current];
    Object.keys(imgCache).forEach(function(id){ imgCache[id].classList.remove('active'); });
    stopPlayback();
    var mount = document.createElement('div');
    mount.id = 'yt-mount';
    screen.appendChild(mount);
    playRing.style.display = 'none';

    function createPlayer(){
      function clearCaptions(target){
        try{ target.setOption('captions', 'track', {}); target.unloadModule('captions'); }catch(e){}
      }
      ytPlayer = new YT.Player('yt-mount', {
        videoId: p.id,
        playerVars: { autoplay: 1, rel: 0, cc_load_policy: 0 },
        events: {
          onReady: function(e){
            e.target.setPlaybackQuality('hd1080');
            clearCaptions(e.target);
            var ifr = e.target.getIframe();
            ifr.allowFullscreen = true;
            requestAnimationFrame(function(){ ifr.classList.add('active'); });
          },
          onApiChange: function(e){
            if (e.target.getOptions().indexOf('captions') !== -1) clearCaptions(e.target);
          },
          onStateChange: function(e){
            if (e.data === YT.PlayerState.PLAYING) clearCaptions(e.target);
          }
        }
      });
    }

    if (ytApiReady && window.YT && YT.Player){ createPlayer(); }
    else { pendingPlay = createPlayer; }
  }

  playRing.addEventListener('click', play);
  buildIndex();

  (function(){
    var prevBtn = document.getElementById('carousel-prev');
    var nextBtn = document.getElementById('carousel-next');
    if (!prevBtn || !nextBtn || !indexEl) return;
    prevBtn.addEventListener('click', function(){ indexEl.scrollBy({ left: -indexEl.clientWidth, behavior: 'smooth' }); });
    nextBtn.addEventListener('click', function(){ indexEl.scrollBy({ left: indexEl.clientWidth, behavior: 'smooth' }); });
  })();

  render();

</script>
